name: Format Issue 7
on:
  push:
    branches: [issue-7-financial-goals]
permissions:
  contents: write
jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - run: gofmt -w server/internal/goal server/internal/finance/goal_service.go server/internal/finance/goal_service_integration_test.go server/internal/httpserver/goal_handlers.go server/internal/httpserver/router.go
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/internal
          git commit -m "style: format goal implementation"
          git push
