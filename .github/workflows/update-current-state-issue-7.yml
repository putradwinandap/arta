name: Update Issue 7 Current State
on:
  push:
    branches: [issue-7-financial-goals]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/context/current-state.md')
          s=p.read_text()
          s=s.replace('PostgreSQL 17\n- Goose SQL migrations through version 5','PostgreSQL 17\n- Goose SQL migrations through version 6')
          s=s.replace('- Goal funding model\n','')
          marker='## Accepted MVP implementation architecture'
          section='''## Implemented reserved-fund financial goals\n\nIssue #7 adds goals whose progress is backed by real wallet funds.\n\n- Goals have household, currency, target amount, active/archived lifecycle, and derived reserved progress.\n- `goal_reservation_events` records explicit reserve/release operations tied to a real source wallet.\n- Reserving money does not change physical wallet balance and is neither income, expense, transfer, nor budget spending.\n- Finance overview distinguishes physical, reserved, and available wallet money; `available = physical balance - reserved`.\n- Reservations cannot exceed available wallet money, preventing the same funds from backing multiple goals.\n- Releases cannot exceed the amount reserved by that goal from that wallet.\n- Goal remaining target is floored at zero while reservation history remains auditable.\n- REST endpoints and PWA workspace support create, edit, archive, reserve, release, and progress display.\n- ADR-007 and `docs/product/financial-goals.md` define the durable semantics.\n\n'''
          if section not in s: s=s.replace(marker,section+marker)
          start=s.index('## Current execution target')
          s=s[:start]+'''## Current execution target\n\nIssue #7 reserved-fund financial goals are implemented in PR #19 and are pending final CI/merge.\n\n## Next execution steps\n\n1. Merge PR #19 only after web, server, and self-hosted E2E CI lanes are green.\n2. Select the next coherent roadmap Issue after the planning-core goal slice is merged.\n3. Preserve exact integer monetary representation and the distinction between physical, reserved, and available funds.\n4. Keep goal reservations separate from income/expense, budget spending, and physical wallet transfers.\n5. Resolve future reconciliation and automatic-capture work through explicit domain decisions rather than weakening the trusted ledger.\n'''
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/context/current-state.md
          git commit -m "docs: record implemented reserved-fund goals"
          git push
